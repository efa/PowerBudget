name: GitHub Actions CI build
run-name: ${{ github.actor }} use GitHub Actions for CI build
on: [push]
jobs:
  GitHub-Actions-CI-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - run: |
          echo "Repository: ${{ github.repository }}, branch: ${{ github.ref }}"
      - run: |
          echo "Running on: ${{ runner.os }}, triggered by: ${{ github.event_name }}"
      # - name: Update distro
      #   run: sudo apt update
      # - name: Upgrade distro
      #   run: sudo apt upgrade
      - name: Install deps
        run: sudo apt install libiniparser-dev libsdl2-dev ;
             sudo apt install 7zip genisoimage grep tar wget
      - name: Check out code
        uses: actions/checkout@v4
      - name: Build ci bin
        run: cd src ; make force
      - name: Build ci pkg
        run: pwd ; cd src ; pwd ; make pkg
      - name: List files in the repository
        run: pwd ;
             ls -l ${{ github.workspace }}/.. ;
      - name: Get date
        run: |
             export DATE=$(date -I)
             echo "DATE: '${DATE}'"
             echo "DATE=${DATE}" >> $GITHUB_ENV
      - name: Reset ci-latest tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATE: ${{ env.DATE }}
        run: |
          VERSION=${{ steps.version_number.outputs.version }}
          git config --global user.email "ci@github.com"
          git config --global user.name "Github CI"
          git tag -d ci-latest       || true
          git push origin :ci-latest || true
          git tag -m ci-latest ci-latest
          git push --tags
          echo "DATE: '${DATE}'"
      - name: Create CI rel
        id: create_release
        uses: ncipollo/release-action@v1.18.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          allowUpdates: true
          draft: false
          name: CI Build
          tag: ci-latest
          prerelease: true
          replacesArtifacts: true
          artifacts: "
            ../PowerBudget_*_Linux_x86_64_64bit.tgz,
            ../PowerBudget_*_Linux_x86_64_64bit.AppImage
          "
      - run: |
          echo "End status: ${{ job.status }}"
