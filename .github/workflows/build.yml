name: GitHub Actions CI build
run-name: ${{ github.actor }} use GitHub Actions for CI build
on: [push]
jobs:
  GitHub-Actions-CI-build:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Repository ${{ github.repository }}, branch ${{ github.ref }}"
      - run: echo "Running on ${{ runner.os }}, triggered by ${{ github.event_name }}"
      - name: Check out code
        uses: actions/checkout@v4
      - name: update distro
        run: sudo apt update
      - name: Install deps
        run: sudo apt install libiniparser-dev libsdl2-dev ;
             sudo apt install 7zip genisoimage grep tar wget
      - name: Build ci
        run: cd src ; make ci
      - name: List files in the repository
        run: ls -l ${{ github.workspace }}/.. ;
             ls -l ${{ github.workspace }} ;
             ls -l ${{ github.workspace }}/src

      - name: Reset ci-latest tag
        run: VERSION=${{ steps.version_number.outputs.version }}
             git config --global user.email "ci@github.com"
             git config --global user.name "Github CI"
             git tag -d ci-latest || true
             git push origin :ci-latest || true
             git tag -m ci-latest ci-latest
             git push --tags
        env: 
             GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create release
        id: create_release
        uses: ncipollo/release-action@v1.18.0
        env: 
             GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          allowUpdates: true
          tag: ci-latest
          name: CI Build
          draft: false
          prerelease: true
          replacesArtifacts: true
          artifacts: "
            ../powerBudget00001a_2025-08-16_Linux_x86_64_64bit.tgz,
            ../powerBudget00001a_2025-08-16_Linux_x86_64_64bit.AppImage
          "

      - run: echo "End status ${{ job.status }}."
