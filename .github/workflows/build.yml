name: GitHub Actions CI build
run-name: ${{ github.actor }} use GitHub Actions for CI build
on: [push]
jobs:
  GitHub-Actions-CI-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - run: |
          echo "Repository: ${{ github.repository }}, branch: ${{ github.ref }}"
      - run: |
          echo "Running on: ${{ runner.os }}, triggered by: ${{ github.event_name }}"
      # - name: Update distro
      #   run: sudo apt update
      # - name: Upgrade distro
      #   run: sudo apt upgrade
      # - name: Install deps
      #  run: sudo apt install libiniparser-dev libsdl2-dev ;
      #       sudo apt install 7zip genisoimage grep tar wget
      - name: Check out code
        uses: actions/checkout@v4
      # - name: Build ci
      #  run: cd src ; make ci
      - name: List files in the repository
        run: ls -l ${{ github.workspace }}/.. ;
             ls -l ${{ github.workspace }} ;
             ls -l ${{ github.workspace }}/src
      - name: Get date
        run: |
             export DATE=$(date -I)
             echo "DATE: $DATE "
             # echo "DATE: ${DATE} "
             # echo "DATE: ${{DATE}} "
      - run: |
          echo "End status: ${{ job.status }}"
